name: Refresh profile cards

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-cards.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate public statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=bracketxzhy&show_icons=true&hide_rank=true&disable_animations=true&bg_color=0d1117&title_color=79b8ff&text_color=b6c6d9&icon_color=56d4dd&border_color=303d50&card_width=495
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Generate public language distribution
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=bracketxzhy&layout=compact&langs_count=6&disable_animations=true&bg_color=0d1117&title_color=79b8ff&text_color=b6c6d9&border_color=303d50&card_width=495
          path: assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Validate SVG cards
        run: python3 scripts/validate-assets.py
      - name: Commit only changed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public profile cards'
          git push
